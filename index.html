<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#06080b"></head><body><title>雨港试玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#06080b; --ink:#eaf2f8; --dim:#8b97a4; --line:rgba(234,242,248,.34);
  --amber:#ffb23e; --gold:#ffd36b; --cyan:#86d8ff; --red:#ff5a4e; --panel:rgba(10,14,19,.86);
  --num:"Saira Condensed","DIN Condensed","Arial Narrow",system-ui,sans-serif;
  --cjk:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--cjk);color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transition:filter .25s}
#app.cover #v{object-fit:cover}
#app.frozen #v{filter:saturate(.3) brightness(.62)}
#stage.shake{animation:shake .22s linear}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}100%{transform:translate(0,0)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#flash,#vig{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash{background:radial-gradient(circle at 50% 60%,rgba(255,211,107,.42),rgba(255,178,62,0) 60%)}
#vig{box-shadow:inset 0 0 120px 30px rgba(255,60,48,.55)}
.zone{position:absolute;top:30%;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:22%;border:2px dashed var(--line);border-radius:18px;pointer-events:none;transition:border-color .12s,background-color .12s}
#zL{left:calc(12px + env(safe-area-inset-left,0px))}
#zR{right:calc(12px + env(safe-area-inset-right,0px))}
.zone.on{border-color:rgba(234,242,248,.85);background-color:rgba(234,242,248,.07)}
.zone .zl{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:600 11px/1 var(--cjk);color:rgba(234,242,248,.4);letter-spacing:.2em}
#layer{position:absolute;inset:0;pointer-events:none}
/* prompts */
.qp{position:absolute;width:0;height:0;pointer-events:none}
.qp .core{position:absolute;left:-31px;top:-31px;width:62px;height:62px;box-sizing:border-box;border-radius:50%;background:rgba(6,8,11,.58);border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink);font:700 24px/1 var(--num);box-shadow:0 0 22px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35) inset;transition:background-color .1s,border-color .1s,transform .1s}
.qp .core b{font-weight:700}
.qp .ring{position:absolute;left:-31px;top:-31px;width:62px;height:62px;box-sizing:border-box;border-radius:50%;border:2px solid rgba(234,242,248,.95);will-change:transform}
.qp .lab{position:absolute;left:-90px;width:180px;top:40px;text-align:center;font:700 15px/1.2 var(--cjk);color:var(--ink);text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8);letter-spacing:.04em}
.qp .sub{display:block;font:600 11px/1.3 var(--cjk);color:var(--gold);letter-spacing:.08em;margin-top:2px}
.qp svg.arc{position:absolute;left:-42px;top:-42px;width:84px;height:84px;transform:rotate(-90deg);overflow:visible}
.qp svg.arc circle.bg{fill:none;stroke:rgba(234,242,248,.18);stroke-width:5}
.qp svg.arc circle.fg{fill:none;stroke:var(--amber);stroke-width:5;stroke-linecap:round;stroke-dasharray:238.76;stroke-dashoffset:238.76}
.qp svg.arc line{stroke:var(--gold);stroke-width:3}
.qp.pressed .core{background:rgba(255,178,62,.38);border-color:var(--amber);transform:scale(.92)}
.qp.release .core{border-color:var(--gold);background:rgba(255,211,107,.55);animation:rel .16s infinite alternate}
@keyframes rel{from{transform:scale(1)}to{transform:scale(1.14)}}
.qp.swipe .core span{display:inline-block;animation:nudge .55s ease-in-out infinite}
@keyframes nudge{0%{transform:translate(0,0)}100%{transform:translate(calc(var(--dx)*9px),calc(var(--dy)*9px))}}
.qp.swipe .trail{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--cyan);opacity:.0}
.qp.wrong .core{border-color:var(--red);animation:wob .2s}
@keyframes wob{0%,100%{transform:translateX(0)}33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
.qp.dim{opacity:.32}
.qp.dim .ring{opacity:0}
.qp.beat .core{width:52px;height:52px;left:-26px;top:-26px;font-size:24px;border-color:var(--amber)}
.qp.beat .ring{width:52px;height:52px;left:-26px;top:-26px;border-color:var(--amber)}
.qp.mash .core{width:78px;height:78px;left:-39px;top:-39px;font-size:30px;border-color:var(--red);animation:mp .12s infinite alternate}
@keyframes mp{from{transform:scale(1)}to{transform:scale(1.07)}}
.qp.big .core{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,211,107,.0)}to{box-shadow:0 0 0 12px rgba(255,211,107,.28)}}
.qp.hit{animation:hitpop .36s ease-out forwards}
@keyframes hitpop{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.qp.miss{animation:missfall .5s ease-in forwards}
@keyframes missfall{0%{opacity:.9;filter:grayscale(1)}100%{opacity:0;transform:translateY(26px) rotate(-8deg);filter:grayscale(1)}}
#dline{position:absolute;height:0;border-top:2px dashed rgba(255,178,62,.7);pointer-events:none;display:none}
#dlab{position:absolute;transform:translateX(-50%);font:700 15px/1 var(--cjk);color:var(--amber);text-shadow:0 1px 3px #000;pointer-events:none;display:none;white-space:nowrap}
#mashbar{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:34%;height:10px;border-radius:5px;background:rgba(234,242,248,.16);overflow:hidden;display:none}
#mashbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--red))}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));pointer-events:none}
#act{font:600 12px/1.2 var(--cjk);letter-spacing:.18em;color:rgba(234,242,248,.72);text-shadow:0 1px 3px #000;transition:opacity .6s}
#right{display:flex;gap:10px;align-items:center}
#combo{font:700 22px/1 var(--num);color:var(--gold);text-shadow:0 1px 4px #000;min-width:60px;text-align:right;opacity:0;transition:opacity .2s}
#combo small{font:600 11px/1 var(--cjk);color:rgba(234,242,248,.7);margin-right:4px;letter-spacing:.1em}
#combo.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.25)}}
button{font-family:var(--cjk)}
#pauseBtn{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(234,242,248,.35);background:rgba(6,8,11,.5);color:var(--ink);font:700 14px/1 var(--num);display:grid;place-items:center;cursor:pointer}
#hint{position:absolute;left:50%;top:calc(46px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(6,8,11,.72);border:1px solid rgba(255,211,107,.45);font:600 14px/1.3 var(--cjk);color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:70%;overflow:hidden;text-overflow:ellipsis}
#hint.on{opacity:1}
#waitb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 22px;border-radius:14px;background:rgba(6,8,11,.78);border:2px solid var(--gold);font:700 22px/1.3 var(--cjk);color:var(--gold);text-align:center;letter-spacing:.06em;pointer-events:none;display:none;text-shadow:0 1px 4px #000}
#waitb small{display:block;font:600 13px/1.4 var(--cjk);color:var(--ink);letter-spacing:.04em;margin-top:4px}
#diag{font:500 11px/1.5 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap;word-break:break-all;max-width:100%}
#backBtn{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));pointer-events:auto;display:none;z-index:8}
#dbg{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(34px + env(safe-area-inset-top,0px));font:500 12px/1.35 ui-monospace,Menlo,monospace;color:#9ff;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:6px;pointer-events:none;white-space:pre;display:none}
/* overlays */
[hidden]{display:none!important}
.ov{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(6,8,11,.55),rgba(6,8,11,.92));padding:16px calc(16px + env(safe-area-inset-right,0px)) 16px calc(16px + env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{max-width:640px;width:100%;display:grid;gap:14px;margin:auto}
@media (max-height:440px){.card{gap:9px}.ttl{font-size:26px}.ttl em{margin-bottom:5px}.lead{font-size:13px;line-height:1.5}.btn{padding:11px 18px}.chips .btn{padding:7px 10px}.tips span{padding:5px 8px}}
.ttl{font:700 34px/1.05 var(--cjk);letter-spacing:.06em}
.ttl em{font:700 15px/1 var(--num);font-style:normal;color:var(--amber);letter-spacing:.28em;display:block;margin-bottom:8px}
.lead{font:500 14px/1.6 var(--cjk);color:rgba(234,242,248,.82);max-width:34em}
.tips{display:flex;flex-wrap:wrap;gap:8px}
.tips span{font:600 12px/1 var(--cjk);padding:7px 10px;border-radius:999px;background:rgba(234,242,248,.08);border:1px solid rgba(234,242,248,.16);color:rgba(234,242,248,.86)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 22px;font:700 16px/1 var(--cjk);background:var(--amber);color:#1b1206;cursor:pointer;letter-spacing:.08em}
.btn.ghost{background:rgba(234,242,248,.08);color:var(--ink);border:1px solid rgba(234,242,248,.22);font-weight:600;font-size:14px;padding:10px 14px}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{padding:9px 12px;font-size:13px}
.small{font:500 12px/1.5 var(--cjk);color:var(--dim)}
#load{font:600 12px/1 var(--num);color:var(--dim);letter-spacing:.1em}
#rotate{display:none;position:absolute;inset:0;background:#06080b;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;z-index:20}
#rotate .ph{width:46px;height:78px;border:3px solid var(--ink);border-radius:9px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
/* results */
.stats{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 34px/1 var(--num);color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font:600 11px/1 var(--cjk);color:var(--dim);letter-spacing:.14em}
#tl{position:relative;height:30px;border-radius:6px;background:rgba(234,242,248,.06)}
#tl i{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%}
#tl i.perfect{background:var(--gold)} #tl i.good{background:var(--ink)} #tl i.partial{background:var(--amber)} #tl i.miss{background:#4b5561} #tl i.skip{background:transparent;border:1px solid #4b5561}
#copybox{width:100%;height:120px;background:#0b0f14;color:var(--ink);border:1px solid #2a3440;border-radius:8px;font:12px/1.4 ui-monospace,Menlo,monospace;display:none}
@media (prefers-reduced-motion:reduce){#stage.shake{animation:none}.qp .core span{animation:none!important}}
</style>

function onDown(p,t){
  for(const q of activeList()){
    if(q.type==='mash'){ if(t>=q.t-0.15 && t<=q.end){ q.count++; const n=q.els; n.forEach(el=>el.querySelector('.core b').textContent=q.count); const [x,y]=elXY(n[p.z==='L'?0:1]); burst(x,y,'#ff8a5e',6,240); sfx.tick(); haptic(false); $('#mashbar i').style.width=Math.min(100,q.count/q.count_need*100)+'%'; if(q.count===q.count_need){ flashIt('#flash',.8); sfx.heavy(); } return; } continue; }
    if(!zoneOk(q,p.z)) continue;
    const fz = frozenQ===q;
    if(q.type==='chain'){ const i=q.next; if(i<q.beats.length){ const b=q.beats[i], w=q.bw[i]; if(Math.abs(t-b)<=w){ beatHit(q,i,t-b); return; } if(t<b-w) return; } continue; }
    if(q.type==='tap'){ if(fz){ resolve(q,'good',0); return; } const dt=t-q.t; if(Math.abs(dt)<=q.win){ resolve(q,grade(dt,q.win),dt); return; } if(dt<-q.win){ nudge(q); return; } continue; }
    if(q.type==='hold' && !q.pid){ if(fz || t<=q.t+q.win){ q.pid=p.id; q.pressT=t; q.els.forEach(el=>el.classList.add('pressed')); sfx.press(); if(fz) unfreeze(); return; } continue; }
    if(q.type==='double' && !(q.pL&&q.pR)){ if(fz || t<=q.t+q.win){ if(p.z==='L'&&!q.pL){q.pL=p.id; q.els[0].classList.add('pressed');} else if(p.z==='R'&&!q.pR){q.pR=p.id; q.els[1].classList.add('pressed');} sfx.press(); if(q.pL&&q.pR){ q.pressT=t; if(fz) unfreeze(); } return; } continue; }
  }
}
function nudge(q){ q.els.forEach(el=>{el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');}); }
function onSwipe(p,t){
  for(const q of activeList()){
    if(!((q.type==='swipe')||(q.type==='swipehold'&&!q.swiped))) continue;
    if(!zoneOk(q,p.z)) continue;
    if(p.dir!==q.dir){ nudge(q); return; }
    const fz=frozenQ===q, dt=t-q.t;
    if(fz || (dt>=-q.win-0.12 && dt<=q.win)){
      const r = fz?'good':grade(dt,q.win); sfx.whoosh();
      if(q.type==='swipe'){ resolve(q,r,fz?0:dt); }
      else { q.swiped=true; q.pid=p.id; q.swRes=r; (q.dts=q.dts||[]).push(fz?0:dt); q.els.forEach(el=>{el.classList.remove('big'); el.classList.add('pressed'); el.querySelector('.core').innerHTML='<b>按</b>'; const s=el.querySelector('.ring'); if(s) s.remove(); el.insertAdjacentHTML('afterbegin',ARC);}); if(fz) unfreeze(); }
      return;
    }
    if(dt<-q.win) { nudge(q); return; }
  }
}
function onUp(p,t){
  for(const q of Q){
    if(q.state!=='active') continue;
    if(q.type==='hold' && q.pid===p.id){
      if(q.release){ if(t<q.end-q.win) resolve(q,'miss',t-q.end); else resolve(q,grade(t-q.end,q.win),t-q.end); }
      else if(t<q.end-0.05) resolve(q,'miss');
    } else if(q.type==='swipehold' && q.pid===p.id){ if(t<q.end-0.05) resolve(q,'miss'); }
    else if(q.type==='double' && (q.pL===p.id||q.pR===p.id)){ if(t<q.end-0.05) resolve(q,'miss'); else { if(q.pL===p.id) q.pL='x'; if(q.pR===p.id) q.pR='x'; } }
  }
}

/* ---------- pointer input ---------- */
const ptrs=new Map();
app.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,.ov,textarea')) return;
  e.preventDefault(); touched=true; initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  if(!running||paused||ended) return;
  const z=e.clientX<innerWidth/2?'L':'R';
  const t0=clock()-LAG; const p={id:e.pointerId,z,x0:e.clientX,y0:e.clientY,sw:false,dir:null,t0};
  ptrs.set(e.pointerId,p); try{app.setPointerCapture(e.pointerId);}catch(_){}
  (z==='L'?zL:zR).classList.add('on');
  onDown(p, t0);
},{passive:false});
app.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p||p.sw) return;
  const dx=e.clientX-p.x0, dy=e.clientY-p.y0;
  if(Math.hypot(dx,dy)>=26){ p.sw=true; p.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); onSwipe(p,(p.t0+clock()-LAG)/2); }
},{passive:true});
function up(e){
  const p=ptrs.get(e.pointerId); if(!p) return; ptrs.delete(e.pointerId);
  const t=clock()-LAG;
  if(!p.sw){ const dx=e.clientX-p.x0, dy=e.clientY-p.y0; if(Math.hypot(dx,dy)>=18){ p.sw=true; p.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); onSwipe(p,(p.t0+t)/2); } }
  const still=[...ptrs.values()].some(o=>o.z===p.z); if(!still) (p.z==='L'?zL:zR).classList.remove('on');
  onUp(p,t);
}
app.addEventListener('pointerup',up); app.addEventListener('pointercancel',up);
app.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- auto (bot) ---------- */
function botAct(q,t){
  switch(q.type){
    case 'tap': case 'swipe': if(t>=q.t){ if(q.type==='swipe') sfx.whoosh(); resolve(q,'perfect',0);} break;
    case 'swipehold': if(!q.swiped&&t>=q.t){ q.swiped=true; q.pid='bot'; q.swRes='perfect'; sfx.whoosh(); q.els.forEach(el=>{el.classList.remove('big'); el.classList.add('pressed'); el.querySelector('.core').innerHTML='<b>按</b>'; const s=el.querySelector('.ring'); if(s) s.remove(); el.insertAdjacentHTML('afterbegin',ARC);}); } break;
    case 'hold': if(!q.pid&&t>=q.t-0.05){ q.pid='bot'; q.pressT=q.t; q.els.forEach(el=>el.classList.add('pressed')); } if(q.release&&q.pid==='bot'&&t>=q.end) resolve(q,'perfect',0); break;
    case 'double': if(!q.pL&&t>=q.t-0.05){ q.pL=q.pR='bot'; q.pressT=q.t; q.els.forEach(el=>el.classList.add('pressed')); } break;
    case 'chain': if(q.next<q.beats.length && t>=q.beats[q.next]) beatHit(q,q.next,0); break;
    case 'mash': if(t>=q.t && t<q.end && (!q.lastBot || t-q.lastBot>1/13)){ q.lastBot=t; onDown({z:Math.random()<.5?'L':'R'},t); } break;
  }
}

/* ---------- per-frame update ---------- */
function upd(q,t){
  if(q.state!=='active') return;
  if(auto){ botAct(q,t); if(q.state!=='active') return; }
  const lateFirst = t > q.t + q.win;
  if(q.freeze && !auto && awaitingFirst(q) && t>=q.t && !frozenQ){ freeze(q); }
  if(frozenQ===q){ if(performance.now()-freezeWall>6000) resolve(q,'miss'); return; }
  switch(q.type){
    case 'tap': case 'swipe': if(lateFirst) resolve(q,'miss'); break;
    case 'swipehold': if(!q.swiped){ if(lateFirst) resolve(q,'miss'); } else if(t>=q.end) resolve(q,q.swRes); break;
    case 'hold':
      if(!q.pid){ if(lateFirst) resolve(q,'miss'); }
      else if(q.release){ if(t>=q.end-0.02) q.els.forEach(el=>el.classList.add('release')); if(t>q.end+q.win) resolve(q,'good',t-q.end); }
      else if(t>=q.end) resolve(q,grade(Math.max(0,(q.pressT||q.t)-q.t),q.win*2));
      break;
    case 'double':
      if(!(q.pL&&q.pR)){ if(lateFirst) resolve(q,'miss'); }
      else if(t>=q.end) resolve(q, grade(Math.max(0,(q.pressT||q.t)-q.t),q.win*2));
      break;
    case 'chain': while(q.state==='active' && q.next<q.beats.length && t>q.beats[q.next]+q.bw[q.next]) beatMiss(q,q.next); break;
    case 'mash': if(t>=q.end){ const need=q.count_need; resolve(q, q.count>=need ? (q.count>=need*1.3?'perfect':'good') : (q.count>=need/2?'partial':'miss')); } break;
  }
}
function render(q,t){
  if(q.state!=='active') return;
  const approach = x => 1 + 1.5*Math.max(0,Math.min(1,x));
  if(q.type==='tap'||q.type==='swipe'||(q.type==='swipehold'&&!q.swiped)){
    const s=approach((q.t-t)/q.A); q.els.forEach(el=>{ const r=el.querySelector('.ring'); if(r) r.style.transform='scale('+s+')'; });
  } else if(q.type==='hold'||q.type==='double'||(q.type==='swipehold'&&q.swiped)){
    const pr=Math.max(0,Math.min(1,(t-q.t)/(q.end-q.t)));
    q.els.forEach(el=>{ const c=el.querySelector('circle.fg'); if(c) c.style.strokeDashoffset=238.76*(1-pr); });
  } else if(q.type==='chain'){
    q.els.forEach((el,i)=>{ if(!el) return; const b=q.beats[i]; const A=Math.min(0.9,Math.max(0.5,q.A)); if(t>=b-A) el.classList.remove('dim'); const r=el.querySelector('.ring'); if(r) r.style.transform='scale('+approach((b-t)/A)+')'; });
  }
}
function targetRate(t){
  let r=1;
  for(const q of Q){ if(q.state!=='active'||q.slow>=1) continue;
    const a=q.t-q.span, b=(q.type==='chain'?q.end:q.t)+q.win;
    if(awaitingFirst(q)||q.type==='chain'){ if(t>=a&&t<=b) r=Math.min(r,q.slow); }
    if(q.type==='hold'&&q.release&&q.pid&&t>=q.end-q.span*0.7&&t<=q.end+q.win) r=Math.min(r,q.slow);
  }
  return r;
}
function actAt(t){ let k=0; DATA.acts.forEach((a,i)=>{ if(t>=a.t) k=i; }); return k; }

let lastWall=performance.now();
function loop(){
  const w=performance.now(), dt=Math.min(0.05,(w-lastWall)/1000); lastWall=w;
  if(running && !paused && !ended){
    const t=clock();
    for(const q of Q){ if(q.state==='pending' && t>=q.appear) activate(q); }
    for(const q of Q){ upd(q,t); render(q,t); }
    const tr=frozenQ?curRate:targetRate(t);
    if(Math.abs(tr-curRate)>0.01){ curRate=tr; try{ v.playbackRate=tr; }catch(e){} }
    const k=actAt(t); if(k!==lastAct){ lastAct=k; actEl.textContent=DATA.acts[k].name; actEl.style.opacity=1; }
    if(debug){ dbgEl.textContent='t '+t.toFixed(3)+'  ×'+v.playbackRate.toFixed(2)+'  lag '+Math.round(LAG*1000)+'ms\n'+activeList().map(q=>q.id+' '+q.type+' '+(q.t-t).toFixed(2)).join('\n'); }
  }
  drawFx(dt);
  requestAnimationFrame(loop);
}

/* ---------- flow ---------- */
function resetQ(from){
  document.querySelectorAll('.qp').forEach(el=>el.remove()); hideDouble(); $('#mashbar').style.display='none';
  Q.forEach(q=>{ Object.assign(q,{state:q.appear<from-0.01?'skip':'pending',res:null,dts:[],pid:null,pL:null,pR:null,swiped:false,next:0,bres:[],count:0,lastBot:0,hits:0,pressT:null,els:[]}); q.count_need=q.count_need||q.count; });
  Q.forEach(q=>{ if(q.type==='mash') q.count_need=DATA.qtes.find(d=>d.id===q.id).count; });
  combo=0; maxCombo=0; breakCombo(); frozenQ=null; app.classList.remove('frozen'); lastAct=-1; ended=false;
}
function startFrom(t0){
  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  startAt=t0; resetQ(t0);
  ['#startOv','#endOv','#pauseOv'].forEach(s=>$(s).hidden=true);
  running=true; paused=false; curRate=1; v.playbackRate=1;
  const go=()=>{ try{ v.currentTime=t0; }catch(e){ diag('seek 失败 '+e.name); } playV('start'); };
  if(v.readyState>=1) go(); else { playV('first'); v.addEventListener('loadedmetadata',go,{once:true}); }
  try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){}
  fit();
}
function pause(){ if(!running||ended) return; paused=true; v.pause(); $('#pauseOv').hidden=false; }
function resume(){ $('#pauseOv').hidden=true; paused=false; if(!frozenQ) v.play().catch(()=>{}); }
function finish(){
  if(ended) return; ended=true; running=false; v.pause();
  const judged=Q.filter(q=>q.state!=='skip');
  let inputs=0, hit=0, perfect=0;
  judged.forEach(q=>{ if(q.type==='chain'){ inputs+=q.beats.length; q.bres.forEach(r=>{ if(r!=='miss'){hit++; if(r==='perfect') perfect++;} }); } else { inputs++; if(q.res==='perfect'||q.res==='good'||q.res==='partial'){ hit++; if(q.res==='perfect') perfect++; } } });
  $('#stats').innerHTML=[['命中',hit+'/'+inputs],['完美',perfect],['最长连击',maxCombo]].map(s=>'<div class="stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>').join('');
  const dur=v.duration||151.37; $('#tl').innerHTML=Q.map(q=>'<i class="'+(q.state==='skip'?'skip':(q.res||'miss'))+'" style="left:'+(q.t/dur*100).toFixed(2)+'%" title="'+q.id+' '+q.label+'"></i>').join('');
  $('#copybox').value=resultText(hit,inputs,perfect);
  $('#endOv').hidden=false;
}
function resultText(hit,inputs,perfect){
  const ms=x=>(x>=0?'+':'')+Math.round(x*1000);
  const lines=Q.filter(q=>q.state!=='skip').map(q=>{
    let r=q.res||'miss'; if(q.type==='chain') r=(q.hits||0)+'/'+q.beats.length;
    return q.id+' '+q.label+'  '+r+(q.dts&&q.dts.length?'  '+q.dts.map(ms).join(',')+'ms':'');
  });
  const ua=/iPhone|iPad/.test(navigator.userAgent)?'iOS':(/Android/.test(navigator.userAgent)?'Android':'桌面');
  return '雨港试玩成绩  命中 '+hit+'/'+inputs+'  完美 '+perfect+'  最长连击 '+maxCombo+'  设备 '+ua+'  延迟补偿 '+Math.round(LAG*1000)+'ms  起点 '+startAt+'s\n'+lines.join('\n');
}
v.addEventListener('ended',finish);
/* ---------- diagnostics ---------- */
const diagEl=$('#diag'); const dlog=[]; const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function diag(m){ dlog.push(m); if(dlog.length>6) dlog.shift(); const e=v.error; diagEl.textContent='诊断 · '+(isIOS?'iOS':'非iOS')+' · 就绪'+v.readyState+' 网络'+v.networkState+(e?' 错误'+e.code+(e.message?' '+e.message:''):'')+'\n'+dlog.join(' | '); }
function playV(tag){ const p=v.play(); if(p&&p.catch) p.then(()=>diag('play ok '+tag)).catch(err=>{ diag('play 被拒 '+tag+' '+err.name); hint('视频没能播放：'+err.name+'。请用 Safari 打开，关掉低电量模式后再点一次',4000); }); }
['loadedmetadata','canplay','playing','waiting','stalled','suspend','error','abort'].forEach(ev=>v.addEventListener(ev,()=>diag(ev)));
if(isIOS){ $('#load').textContent='iPhone 要点「开始」才开始加载视频（约 14MB）'; }
let vtMode=false;
$('#vtBtn').onclick=()=>{ vtMode=true; running=false; ['#startOv','#endOv','#pauseOv'].forEach(s=>$(s).hidden=true); $('#backBtn').style.display='block'; v.muted=false; try{v.currentTime=0;}catch(e){} playV('只测视频'); hint('纯播放测试：能看到画面在动、有声音，就说明视频没问题',3500); };
$('#backBtn').onclick=()=>{ vtMode=false; v.pause(); $('#backBtn').style.display='none'; $('#startOv').hidden=false; diag('返回'); };
diag('页面已加载 '+navigator.userAgent.slice(0,70));
v.addEventListener('progress',()=>{ try{ const b=v.buffered; if(b.length){ const p=Math.min(100,Math.round(b.end(b.length-1)/(v.duration||151)*100)); $('#load').textContent=p>=99?'视频已就绪':'视频加载 '+p+'%'; } }catch(e){} });
v.addEventListener('canplaythrough',()=>{$('#load').textContent='视频已就绪';});
v.addEventListener('waiting',()=>{ if(running&&!paused) hint('网络慢，缓冲中…',1500); });
try{ matchMedia('(orientation: portrait)').addEventListener('change',e=>{ if(e.matches&&running&&!paused&&!ended) pause(); }); }catch(e){}
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&running&&!paused&&!ended) pause(); });

function chips(sel){ const box=$(sel); box.innerHTML=''; DATA.chapters.forEach(c=>{ const b=document.createElement('button'); b.className='btn ghost'; b.textContent=c.name; b.onclick=()=>startFrom(c.t); box.appendChild(b); }); }
chips('#chapters'); chips('#chapters2'); chips('#chapters3');
$('#startBtn').onclick=()=>startFrom(0);
$('#pauseBtn').onclick=pause;
$('#resumeBtn').onclick=resume;
$('#restartBtn').onclick=()=>startFrom(0);
$('#againBtn').onclick=()=>startFrom(0);
$('#autoBtn').onclick=e=>{ auto=!auto; e.target.textContent='自动演示：'+(auto?'开':'关'); };
$('#dbgBtn').onclick=e=>{ debug=!debug; dbgEl.style.display=debug?'block':'none'; e.target.textContent='调试信息：'+(debug?'开':'关'); };
function showLag(){ $('#lagVal').textContent=Math.round(LAG*1000)+' ms'; try{localStorage.setItem('qte_lag',LAG);}catch(e){} }
$('#lagMinus').onclick=()=>{ LAG=Math.max(-0.1,LAG-0.01); showLag(); };
$('#lagPlus').onclick=()=>{ LAG=Math.min(0.2,LAG+0.01); showLag(); };
showLag();
$('#copyBtn').onclick=()=>{ const txt=$('#copybox').value; const box=$('#copybox'); const fb=()=>{ box.style.display='block'; box.focus(); box.select(); $('#copyBtn').textContent='已选中，手动复制'; };
  try{ navigator.clipboard.writeText(txt).then(()=>{$('#copyBtn').textContent='已复制';},fb); }catch(e){ fb(); } };
const pm=location.hash.match(/^#pose-([\d.]+)(-auto)?$/);
if(pm){ const PT=+pm[1]; auto=!!pm[2]; clockOverride=PT; resetQ(0); Q.forEach(q=>{ if((q.end||q.t)+0.5<PT) q.state='skip'; }); ['#startOv','#endOv','#pauseOv'].forEach(s=>$(s).hidden=true); running=true; paused=false; v.muted=true; const seek=()=>{ try{v.currentTime=PT;}catch(e){} }; if(v.readyState>=1) seek(); else v.addEventListener('loadedmetadata',seek,{once:true}); }
if(location.hash==='#auto'){ auto=true; $('#autoBtn').textContent='自动演示：开'; }
if(location.hash==='#debug'){ debug=true; dbgEl.style.display='block'; $('#dbgBtn').textContent='调试信息：开'; }
window.__qte={Q,startFrom,get t(){return clock();},set auto(x){auto=x;},finish};
fit(); requestAnimationFrame(loop);
})();
</script>
</body></html>
